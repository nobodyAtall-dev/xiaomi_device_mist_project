name: Mist Phase 4B - Dual stock integration audit (read only)
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (self-hosted recommended with 150 GB free)
        default: ubuntu-24.04
        type: string
permissions:
  contents: read
concurrency:
  group: mist-bringup
  cancel-in-progress: false
jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        firmware: [hyperos3, hyperos4]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install extraction tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y aria2 python3-venv erofs-utils p7zip-full android-sdk-libsparse-utils e2fsprogs file git binutils cpio lz4 device-tree-compiler kmod unzip mtools gzip xz-utils zstd
          python3 -m venv "$RUNNER_TEMP/mist-venv"
          "$RUNNER_TEMP/mist-venv/bin/pip" install dumpyara==1.1.0 requests beautifulsoup4 pyelftools
          echo "$RUNNER_TEMP/mist-venv/bin" >> "$GITHUB_PATH"
          work=$(mktemp -d "$RUNNER_TEMP/mist-phase4b-${{ matrix.firmware }}-XXXXXX")
          echo "MIST_WORK=$work" >> "$GITHUB_ENV"
          df -h "$RUNNER_TEMP"
      - name: Validate audit Python syntax before downloads
        run: |
          python -m py_compile scripts/audit-mist-phase4b.py scripts/compare-mist-phase4b.py
      - name: Discover and download HyperOS 3 fastboot
        if: matrix.firmware == 'hyperos3'
        run: |
          set -euxo pipefail
          cd "$MIST_WORK"
          mkdir -p reports
          echo 'Firmware discovery started' > reports/discovery-status.txt
          python - <<'PY'
          import re,requests,html,json,concurrent.futures
          from pathlib import Path
          from urllib.parse import urlparse
          pattern=re.compile(r'mist_global_images_(OS3\.\d+\.\d+\.\d+\.[A-Z]{3}MIXM)_\d{8}\.\d+\.\d+_16\.0_global_[a-f0-9]+\.tgz',re.I)
          pages=['https://droidforge.net/xiaomi/redmi-note-17-5g-mist?lang=en','https://mifw.net/devices/mist','https://mifw.net/devices/mist?page=1','https://xiaomifirmwareupdater.com/archive/miui/mist/','https://mirom.ezbox.idv.tw/en/phone/mist/','https://upmiui.com/?page=40','https://xiaomihive.com/firmware/mist/']
          known='mist_global_images_OS3.0.304.0.WPUMIXM_20260917.0000.00_16.0_global_c4450c4e16.tgz'
          hosts=['bn.d.miui.com','bigota.d.miui.com','hugeota.d.miui.com','cdnorg.d.miui.com','ultimateota.d.miui.com']
          def get(page):
              try:
                  r=requests.get(page,timeout=35,headers={'User-Agent':'Mozilla/5.0'});r.raise_for_status()
                  return page,html.unescape(r.text).replace('\\/','/'),None
              except Exception as e: return page,'',str(e)
          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as pool: results=list(pool.map(get,pages))
          names={known}
          for page,body,error in results:
              names.update(m.group(0) for m in pattern.finditer(body))
          def ver(n): return tuple(map(int,pattern.fullmatch(n).group(1).removeprefix('OS').split('.')[:4]))
          assert ver(known)==(3,0,304,0), 'Version parser regression'
          names=[known]  # Pin the previously reviewed OS3.0.304.0 package.
          print('Discovered candidates:', names, flush=True)
          report={'sources':[{'page':p,'error':e,'matches':sorted(set(m.group(0) for m in pattern.finditer(b)))} for p,b,e in results],'candidates':names,'probes':[]}
          out=Path('reports/firmware-source.json')
          out.write_text(json.dumps(report,indent=2))
          for name in names:
              version=pattern.fullmatch(name).group(1)
              for host in hosts:
                  url=f'https://{host}/{version}/{name}'
                  try:
                      with requests.get(url,headers={'Range':'bytes=0-15','Accept-Encoding':'identity'},stream=True,timeout=20) as r:
                          ok=r.status_code in (200,206) and r.raw.read(2)==b'\x1f\x8b'
                          report['probes'].append({'url':url,'status':r.status_code,'gzip':ok})
                      if ok:
                          report['selected']=url
                          out.write_text(json.dumps(report,indent=2))
                          Path('rom-url.txt').write_text(url)
                          print('Selected:',url)
                          raise SystemExit(0)
                  except requests.RequestException as e: report['probes'].append({'url':url,'error':str(e)})
                  finally: out.write_text(json.dumps(report,indent=2))
          raise SystemExit('No reachable matching fastboot package; see firmware-source.json')
          PY
          cat reports/firmware-source.json
          aria2c -x16 -s16 -k1M --max-tries=10 --retry-wait=5 --continue=true --auto-file-renaming=false -o stock.tgz "$(cat rom-url.txt)"
          sha256sum stock.tgz > reports/archive.sha256
          md5sum stock.tgz > reports/archive.md5
          tar -tzf stock.tgz > reports/archive-files.txt
          mkdir stock
          tar -xzf stock.tgz -C stock --no-same-owner --no-same-permissions
      - name: Discover and download HyperOS 4 full OTA
        if: matrix.firmware == 'hyperos4'
        run: |
          set -euo pipefail
          cd "$MIST_WORK"
          mkdir -p reports stock/images
          python - <<'PY'
          import json, requests
          from pathlib import Path
          name='mist_global-ota_full-OS4.0.8.0.XPUMIXM-user-17.0-3695aedf1f.zip'
          version='OS4.0.8.0.XPUMIXM'
          report={'md5':'3695aedf1f96d96bbdac41bb247bc8bf','probes':[]}
          out=Path('reports/firmware-source.json')
          for host in ('bn.d.miui.com','bigota.d.miui.com','hugeota.d.miui.com','cdnorg.d.miui.com','ultimateota.d.miui.com'):
              url=f'https://{host}/{version}/{name}'
              try:
                  with requests.get(url,headers={'Range':'bytes=0-15','Accept-Encoding':'identity'},stream=True,timeout=25) as r:
                      ok=r.status_code in (200,206) and r.raw.read(4)==b'PK\x03\x04'
                      report['probes'].append({'url':url,'status':r.status_code,'zip':ok})
                  if ok:
                      report['selected']=url
                      Path('rom-url.txt').write_text(url)
                      break
              except requests.RequestException as e:
                  report['probes'].append({'url':url,'error':str(e)})
          out.write_text(json.dumps(report,indent=2))
          if 'selected' not in report:
              raise SystemExit('Pinned HyperOS 4 OTA unreachable')
          PY
          aria2c -x16 -s16 -k1M --max-tries=10 --retry-wait=5 --continue=true --auto-file-renaming=false -o stock.zip "$(cat rom-url.txt)"
          sha256sum stock.zip > reports/archive.sha256
          md5sum stock.zip > reports/archive.md5
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          p=Path('stock.zip')
          expected='3695aedf1f96d96bbdac41bb247bc8bf'
          if expected:
              with p.open('rb') as f: actual=hashlib.file_digest(f,'md5').hexdigest()
              assert actual==expected, 'OTA MD5 mismatch'
          with zipfile.ZipFile(p) as z:
              assert 'payload.bin' in z.namelist(), 'No payload.bin'
              Path('reports/archive-files.txt').write_text('\n'.join(z.namelist()))
              for n in ('META-INF/com/android/metadata','payload_properties.txt'):
                  if n in z.namelist(): Path('reports/'+n.rsplit('/',1)[-1]).write_bytes(z.read(n))
              assert 'pre-device=mist' in Path('reports/metadata').read_text(), 'Wrong OTA device'
          PY
          # Retain payload images for boot/AVB analysis using Dumpyara debug mode.
          python -m dumpyara stock.zip -o "$PWD/dump" -v -d 2>&1 | tee reports/extraction.log
          if [ -d dump/temp_raw_images ]; then
            for img in "$PWD"/dump/temp_raw_images/*.img; do
              [ -f "$img" ] || continue
              ln -s "$img" "stock/images/$(basename "$img")"
            done
          fi
          find dump -printf '%y %s %p -> %l\n' > reports/extracted-files.txt
      - name: Extract partitions and inventory
        if: matrix.firmware == 'hyperos3'
        run: |
          set -euxo pipefail
          cd "$MIST_WORK"
          find stock -type f -print0 | xargs -0 -r sha256sum > reports/stock-files.sha256
          find stock -type f -print0 | xargs -0 -r file > reports/stock-file-types.txt
          python -m dumpyara stock.tgz -o "$PWD/dump" -v 2>&1 | tee reports/extraction.log
          find dump -printf '%y %s %p -> %l\n' > reports/extracted-files.txt
          find dump -type f \( -name '*.prop' -o -name 'fstab*' -o -name '*.rc' -o -name '*manifest*.xml' -o -name '*compatibility_matrix*.xml' -o -name 'modules.load*' \) -print0 | while IFS= read -r -d '' p; do
            printf '\n===== %s =====\n' "$p"
            cat "$p"
          done > reports/configuration.txt
          find dump -type f -name '*.ko' > reports/kernel-modules.txt
          find dump -type f -name '*.so' > reports/shared-libraries.txt
          find stock -type f \( -name '*.xml' -o -name '*.txt' \) -print0 | while IFS= read -r -d '' p; do
            printf '\n===== %s =====\n' "$p"; cat "$p"
          done > reports/flash-metadata.txt

      - name: Checkout current Mist trees without write operations
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          cd "$MIST_WORK"
          test -n "$GH_TOKEN"
          mkdir -p android/device/xiaomi android/vendor/xiaomi android/kernel/xiaomi
          for entry in 'android_device_xiaomi_mist device/xiaomi/mist' 'android_vendor_xiaomi_mist vendor/xiaomi/mist' 'android_kernel_xiaomi_mist-prebuilt kernel/xiaomi/mist-prebuilt'; do
            read -r repo dest <<< "$entry"
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' clone --depth=1 -b lineage-24 "https://github.com/nobodyAtall-dev/$repo.git" "android/$dest"
            printf '%s %s\n' "$repo" "$(git -C "android/$dest" rev-parse HEAD)" >> reports/current-tree-commits.txt
          done
      - name: Collect integration evidence
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/scripts/audit-mist-phase4b.py" "$MIST_WORK"
      - name: Collect stock boot AVB and modem evidence
        run: |
          set -euo pipefail
          cd "$MIST_WORK"
          mkdir -p reports/avb reports/boot
          git clone --depth=1 https://android.googlesource.com/platform/external/avb avb
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg
          git -C avb rev-parse HEAD > reports/avb-tool-commit.txt
          git -C mkbootimg rev-parse HEAD > reports/boot-tool-commit.txt
          find stock \( -type f -o -type l \) -name '*.img' -print0 | while IFS= read -r -d '' img; do
            name=$(basename "$img")
            case "$name" in
              vbmeta*|boot.img|init_boot.img|vendor_boot.img|recovery.img|dtbo.img|rescue.img)
                python avb/avbtool.py info_image --image "$img" > "reports/avb/$name.txt" 2>&1 || echo "AVB diagnostic: $name" >> reports/image-diagnostics.txt
                ;;
            esac
            case "$name" in
              boot.img|init_boot.img|vendor_boot.img|recovery.img)
                mkdir -p "boot-unpack/$name"
                python mkbootimg/unpack_bootimg.py --boot_img "$img" --out "boot-unpack/$name" > "reports/boot/$name.txt" 2>&1 || echo "Boot header diagnostic: $name" >> reports/image-diagnostics.txt
                ;;
              modem.img)
                mdir -i "$img" -/ :: > reports/modem-fat-list.txt 2>&1 || echo "Modem FAT diagnostic" >> reports/image-diagnostics.txt
                ;;
            esac
          done
      - name: Upload integration reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mist-phase4b-${{ matrix.firmware }}
          path: ${{ env.MIST_WORK }}/reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Remove temporary firmware and private checkout
        if: always()
        run: |
          if [[ "${MIST_WORK:-}" == "$RUNNER_TEMP"/mist-phase4b-* ]]; then
            rm -rf -- "$MIST_WORK"
          fi
  compare:
    needs: analyze
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: mist-phase4b-*
          path: evidence
      - name: Compare exact stock baselines
        run: python3 scripts/compare-mist-phase4b.py evidence comparison
      - name: Index matching upstream source providers
        run: |
          set -euo pipefail
          mkdir -p comparison/source-providers "$RUNNER_TEMP/mist-source-index"
          while read -r repo branch; do
            name=${repo##*/}
            dest="$RUNNER_TEMP/mist-source-index/$name"
            out="comparison/source-providers/$name"
            mkdir -p "$out"
            if ! git clone --depth=1 --filter=blob:none --no-checkout -b "$branch" "https://github.com/$repo.git" "$dest" > "$out/clone.log" 2>&1; then
              echo "$repo $branch unavailable" >> comparison/source-provider-diagnostics.txt
              continue
            fi
            git -C "$dest" rev-parse HEAD > "$out/commit.txt"
            git -C "$dest" ls-tree -r --name-only HEAD > "$out/paths.txt"
            grep -Ei 'media_codecs|c2audio.*policy|wlan.*symlink|WCNSS|health|camera|vintf|manifest.*xml|compatibility_matrix' "$out/paths.txt" > "$out/relevant-paths.txt" || true
          done <<'SOURCES'
          LineageOS/android_frameworks_av lineage-24.0
          LineageOS/android_hardware_qcom_audio-ar lineage-24.0-caf-sm8450-6.6
          LineageOS/android_hardware_qcom-caf_common lineage-24.0
          LineageOS/android_hardware_interfaces lineage-24.0
          LineageOS/android_hardware_xiaomi lineage-24.0
          LineageOS/android_system_core lineage-24.0
          LineageOS/android_system_sepolicy lineage-24.0
          xiaomi-ravelin/android_device_xiaomi_sm4450-common lineage-24.0
          SOURCES
      - uses: actions/upload-artifact@v4
        with:
          name: mist-phase4b-comparison
          path: comparison
          retention-days: 30
