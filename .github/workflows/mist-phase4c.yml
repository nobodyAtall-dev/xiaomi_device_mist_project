name: Mist Phase 4C - Targeted stock integration
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label
        default: ubuntu-24.04
        type: string
      publish:
        description: Publish validated incremental device and private vendor changes
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: mist-bringup
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize audit workspace
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/mist-phase4c-XXXXXX")
          mkdir -p "$work/reports"
          echo "MIST_WORK=$work" >> "$GITHUB_ENV"
          df -h "$RUNNER_TEMP" > "$work/reports/disk-space.txt"
      - name: Install extraction tools
        run: |
          set -euo pipefail
          # Use Ubuntu's signed repositories only; Microsoft feeds are unrelated.
          apt_opts=(-o Acquire::Retries=3)
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            apt_opts+=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          elif [ -f /etc/apt/sources.list ]; then
            apt_opts+=(-o Dir::Etc::sourcelist=/etc/apt/sources.list -o Dir::Etc::sourceparts=-)
          else
            echo "No Ubuntu APT source file found" | tee "$MIST_WORK/reports/install.log"
            exit 1
          fi
          {
            sudo apt-get "${apt_opts[@]}" update
            sudo apt-get "${apt_opts[@]}" install -y aria2 python3-venv erofs-utils p7zip-full android-sdk-libsparse-utils e2fsprogs file git binutils cpio lz4 device-tree-compiler kmod unzip mtools gzip xz-utils zstd llvm patchelf
            python3 -m venv "$MIST_WORK/venv"
            "$MIST_WORK/venv/bin/pip" install dumpyara==1.1.0 requests beautifulsoup4 pyelftools
          } 2>&1 | tee "$MIST_WORK/reports/install.log"
          echo "$MIST_WORK/venv/bin" >> "$GITHUB_PATH"
      - name: Validate integration script before downloads
        run: python -m py_compile scripts/integrate-mist-phase4c.py
      - name: Discover and download HyperOS 4 full OTA
        run: |
          set -euo pipefail
          cd "$MIST_WORK"
          mkdir -p reports stock/images
          python - <<'PY'
          import json, requests
          from pathlib import Path
          name='mist_global-ota_full-OS4.0.8.0.XPUMIXM-user-17.0-3695aedf1f.zip'
          version='OS4.0.8.0.XPUMIXM'
          report={'md5':'3695aedf1f96d96bbdac41bb247bc8bf','probes':[]}
          out=Path('reports/firmware-source.json')
          for host in ('bn.d.miui.com','bigota.d.miui.com','hugeota.d.miui.com','cdnorg.d.miui.com','ultimateota.d.miui.com'):
              url=f'https://{host}/{version}/{name}'
              try:
                  with requests.get(url,headers={'Range':'bytes=0-15','Accept-Encoding':'identity'},stream=True,timeout=25) as r:
                      ok=r.status_code in (200,206) and r.raw.read(4)==b'PK\x03\x04'
                      report['probes'].append({'url':url,'status':r.status_code,'zip':ok})
                  if ok:
                      report['selected']=url
                      Path('rom-url.txt').write_text(url)
                      break
              except requests.RequestException as e:
                  report['probes'].append({'url':url,'error':str(e)})
          out.write_text(json.dumps(report,indent=2))
          if 'selected' not in report:
              raise SystemExit('Pinned HyperOS 4 OTA unreachable')
          PY
          aria2c -x16 -s16 -k1M --max-tries=10 --retry-wait=5 --continue=true --auto-file-renaming=false -o stock.zip "$(cat rom-url.txt)"
          sha256sum stock.zip > reports/archive.sha256
          md5sum stock.zip > reports/archive.md5
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          p=Path('stock.zip')
          expected='3695aedf1f96d96bbdac41bb247bc8bf'
          if expected:
              with p.open('rb') as f: actual=hashlib.file_digest(f,'md5').hexdigest()
              assert actual==expected, 'OTA MD5 mismatch'
          with zipfile.ZipFile(p) as z:
              assert 'payload.bin' in z.namelist(), 'No payload.bin'
              Path('reports/archive-files.txt').write_text('\n'.join(z.namelist()))
              for n in ('META-INF/com/android/metadata','payload_properties.txt'):
                  if n in z.namelist(): Path('reports/'+n.rsplit('/',1)[-1]).write_bytes(z.read(n))
              assert 'pre-device=mist' in Path('reports/metadata').read_text(), 'Wrong OTA device'
          PY
          # Retain payload images for boot/AVB analysis using Dumpyara debug mode.
          python -m dumpyara stock.zip -o "$PWD/dump" -v -d 2>&1 | tee reports/extraction.log
          if [ -d dump/temp_raw_images ]; then
            for img in "$PWD"/dump/temp_raw_images/*.img; do
              [ -f "$img" ] || continue
              ln -s "$img" "stock/images/$(basename "$img")"
            done
          fi
          find dump -printf '%y %s %p -> %l\n' > reports/extracted-files.txt

      - name: Checkout current device and private vendor trees
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          cd "$MIST_WORK"
          test "$(gh api repos/nobodyAtall-dev/android_vendor_xiaomi_mist --jq .private)" = true
          mkdir -p android/device/xiaomi android/vendor/xiaomi android/tools android/prebuilts/clang/host/linux-x86/llvm-binutils-stable
          for entry in 'nobodyAtall-dev/android_device_xiaomi_mist lineage-24 device/xiaomi/mist' 'nobodyAtall-dev/android_vendor_xiaomi_mist lineage-24 vendor/xiaomi/mist' 'LineageOS/android_tools_extract-utils lineage-24.0 tools/extract-utils' 'LineageOS/android_prebuilts_extract-tools lineage-24.0 prebuilts/extract-tools'; do
            read -r repo branch dest <<< "$entry"
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' clone --depth=1 -b "$branch" "https://github.com/$repo.git" "android/$dest"
            printf '%s %s\n' "$repo" "$(git -C "android/$dest" rev-parse HEAD)" >> reports/input-commits.txt
          done
          for binary in llvm-objdump llvm-strip; do
            ln -s "$(command -v "$binary")" "android/prebuilts/clang/host/linux-x86/llvm-binutils-stable/$binary"
          done
      - name: Verify source providers and record MiCode Mist references
        run: |
          set -euo pipefail
          cd "$MIST_WORK"
          python - <<'PY'
          import requests
          from pathlib import Path
          refs = [
            ('LineageOS/android_frameworks_av','lineage-24.0','media/libstagefright/data/', ['media_codecs_google_audio.xml','media_codecs_google_telephony.xml','media_codecs_google_c2.xml','media_codecs_google_c2_audio.xml','media_codecs_google_c2_video.xml']),
            ('LineageOS/android_hardware_qcom_audio-ar','lineage-24.0-caf-sm8450-6.6','configs/common/',['media_codecs_vendor_audio.xml']),
          ]
          with Path('reports/source-verification.txt').open('w') as out:
              for repo,branch,prefix,names in refs:
                  for name in names:
                      url=f'https://raw.githubusercontent.com/{repo}/{branch}/{prefix}{name}'
                      response=requests.get(url,timeout=60)
                      response.raise_for_status()
                      import xml.etree.ElementTree as ET
                      ET.fromstring(response.content)
                      out.write(url+' OK\n')
          PY
          for repo in Xiaomi_Kernel_OpenSource vendor_qcom_opensource_audio-kernel vendor_qcom_opensource_data-kernel vendor_qcom_opensource_wlan vendor_qcom_opensource_camera-kernel vendor_qcom_proprietary_camera-devicetree vendor_qcom_proprietary_display-devicetree vendor_opensource_display-drivers kernel_devicetree kernel_build; do
            printf '%s ' "$repo" >> reports/micode-mist-refs.txt
            git ls-remote "https://github.com/MiCode/$repo.git" refs/heads/mist-w-oss >> reports/micode-mist-refs.txt || echo unavailable >> reports/micode-mist-refs.txt
          done
      - name: Select only missing stock hardware assets
        run: |
          set -euo pipefail
          cd "$MIST_WORK"
          python "$GITHUB_WORKSPACE/scripts/integrate-mist-phase4c.py" "$MIST_WORK"
      - name: Extract new section only and regenerate vendor build files
        run: |
          set -euo pipefail
          cd "$MIST_WORK"
          if [ -d dump/system/system ]; then
            for entry in dump/system/system/*; do
              dest="dump/system/$(basename "$entry")"
              if [ ! -e "$dest" ] && [ ! -L "$dest" ]; then ln -s "system/$(basename "$entry")" "$dest"; fi
            done
          fi
          export PYTHONPATH="$PWD/android/tools/extract-utils"
          python android/device/xiaomi/mist/extract-files.py --no-cleanup --section "Mist Phase 4C camera hardware closure" "$PWD/dump" 2>&1 | tee reports/targeted-extract.log
          python android/device/xiaomi/mist/setup-makefiles.py 2>&1 | tee reports/regenerate-makefiles.log
      - name: Validate additive changes and protected files
        run: |
          set -euo pipefail
          cd "$MIST_WORK"
          python - <<'PY'
          import json, subprocess, re, hashlib
          from pathlib import Path
          dev=Path('android/device/xiaomi/mist')
          vendor=Path('android/vendor/xiaomi/mist')
          def git(root,*a):return subprocess.check_output(['git','-C',str(root),*a],text=True)
          data=json.loads(Path('reports/phase4c-selection.json').read_text())
          selected={'proprietary/'+n for n in data['added']}
          for n in data['added']:
              p=vendor/'proprietary'/n
              assert p.is_file() and not p.is_symlink(),n
              assert p.read_bytes()==(Path('dump')/n).read_bytes(), 'New stock bytes differ: '+n
          allowed={'proprietary-files.txt','device.mk','sepolicy/vendor/file_contexts','sepolicy/vendor/service_contexts'}
          changed=set(git(dev,'diff','--name-only').splitlines())
          assert changed<=allowed,changed-allowed
          old=git(dev,'show','HEAD:proprietary-files.txt')
          assert (dev/'proprietary-files.txt').read_text().startswith(old.rstrip()),'Existing blob directives changed'
          existing_changes=set(git(vendor,'diff','--name-only').splitlines())
          assert existing_changes<={'Android.bp','Android.mk','mist-vendor.mk','BoardConfigVendor.mk'},existing_changes
          added=set(git(vendor,'ls-files','--others','--exclude-standard').splitlines())
          assert added<=selected,added-selected
          for n in selected:assert n in added or n in git(vendor,'ls-files').splitlines(),n
          for p in (vendor/'Android.bp',vendor/'mist-vendor.mk'):
              assert p.stat().st_size
          # Prevent accidental duplicate module definitions inside generated tree.
          names=re.findall(r'(?m)^\s*name:\s*"([^"]+)"', (vendor/'Android.bp').read_text())
          from collections import Counter
          dup=[n for n,c in Counter(names).items() if c>1]
          assert not dup,dup
          for root in (dev,vendor):
              assert not any(p.stat().st_size>=104857600 for p in root.rglob('*') if p.is_file() and not p.is_symlink() and '.git' not in p.parts)
          Path('reports/validation.txt').write_text('Existing proprietary files unchanged; protected device files unchanged; selected assets byte-identical; generated module names unique. Build/runtime pending.\n')
          PY
          git -C android/device/xiaomi/mist diff --stat > reports/device-diff-stat.txt
          git -C android/vendor/xiaomi/mist status --short > reports/vendor-status.txt
      - name: Publish additive integration
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          cd "$MIST_WORK"
          test "$(gh api repos/nobodyAtall-dev/android_vendor_xiaomi_mist --jq .private)" = true
          device=android/device/xiaomi/mist
          vendor=android/vendor/xiaomi/mist
          for dir in "$device" "$vendor"; do
            git -C "$dir" config user.name nobodyAtall-dev
            git -C "$dir" config user.email "nobodyAtall-dev@users.noreply.github.com"
            test "$(git -C "$dir" rev-parse HEAD)" = "$(git -C "$dir" -c credential.helper= -c 'credential.helper=!gh auth git-credential' ls-remote origin refs/heads/lineage-24 | cut -f1)"
          done
          git -C "$device" add proprietary-files.txt device.mk sepolicy/vendor/file_contexts sepolicy/vendor/service_contexts
          git -C "$vendor" add Android.bp Android.mk mist-vendor.mk BoardConfigVendor.mk proprietary
          for dir in "$vendor" "$device"; do
            if ! git -C "$dir" diff --cached --quiet; then
              git -C "$dir" commit -m "Integrate Phase 4C verified Mist camera and codec assets"
              git -C "$dir" -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:lineage-24
            fi
            printf '%s %s\n' "$dir" "$(git -C "$dir" rev-parse HEAD)" >> reports/publication.txt
          done
      - name: Upload integration diagnostics
        if: always() && env.MIST_WORK != ''
        uses: actions/upload-artifact@v4
        with:
          name: mist-phase4c-integration
          path: ${{ env.MIST_WORK }}/reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Clean temporary work
        if: always()
        run: |
          if [[ "${MIST_WORK:-}" == "$RUNNER_TEMP"/mist-phase4c-* ]]; then
            rm -rf -- "$MIST_WORK"
          fi
